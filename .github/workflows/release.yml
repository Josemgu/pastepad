name: Build and release

# Compila el .exe en un runner limpio de GitHub y lo publica.
# Ventaja sobre compilar en tu maquina: cualquiera puede ver el registro
# de la compilacion y comprobar que el binario sale del codigo publicado.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # La version sale del tag, no escrita a mano en doce sitios: se
      # publico una release con binarios viejos justamente por eso.
      - name: Averiguar la version
        id: v
        shell: pwsh
        run: |
          $t = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $t -or $t -eq "main") { $t = "0.0.0-dev" }
          "version=$t" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "version: $t"

      - name: Run tests
        run: python prueba.py

      # flet pack y no flet build: el segundo compila con el SDK de
      # Flutter, mas de un giga de descarga en cada ejecucion del CI.
      - name: Build
        run: |
          flet pack main.py --onedir --name pastepad `
            --icon docs/pastepad.ico `
            --product-name pastepad `
            --file-description "pastepad - gestor de portapapeles" `
            --product-version ${{ steps.v.outputs.version }} `
            --file-version ${{ steps.v.outputs.version }} `
            --company-name "Jose Miguel Ortiz" `
            --copyright "MIT License" `
            --distpath instalador/dist -y

      # Un solo archivo con todo dentro. Es la version que no se puede
      # romper: separar el .exe de su carpeta _internal da el error de
      # "no se encuentra python311.dll", y aqui no hay carpeta que
      # separar.
      - name: Build portable
        run: |
          flet pack main.py --name pastepad-portable `
            --icon docs/pastepad.ico `
            --product-name pastepad `
            --file-description "pastepad - gestor de portapapeles" `
            --product-version ${{ steps.v.outputs.version }} `
            --file-version ${{ steps.v.outputs.version }} `
            --company-name "Jose Miguel Ortiz" `
            --copyright "MIT License" `
            --distpath instalador/portable -y

      # Se publica el zip entero y no el .exe suelto: en la version
      # instalable el ejecutable necesita las dependencias que hay a su
      # lado, y ademas asi el instalador viaja con el.
      - name: Empaquetar y firmar los hashes
        run: |
          $exe = "instalador\dist\pastepad\pastepad.exe"
          $port = "instalador\portable\pastepad-portable.exe"
          if (-not (Test-Path $exe))  { throw "No se genero pastepad.exe" }
          if (-not (Test-Path $port)) { throw "No se genero el portable" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -DestinationPath dist\pastepad-${{ steps.v.outputs.version }}.zip `
            -Path instalador\dist\pastepad, instalador\instalar.bat,
                  instalador\desinstalar.bat, instalador\LEEME.txt
          Copy-Item $port dist\pastepad-${{ steps.v.outputs.version }}-portable.exe -Force
          $lineas = @()
          foreach ($f in "pastepad-${{ steps.v.outputs.version }}.zip", "pastepad-${{ steps.v.outputs.version }}-portable.exe") {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash
            $lineas += "$h  $f"
            Write-Host "$f  ->  $h"
          }
          $lineas | Out-File -Encoding ascii dist\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pastepad
          path: |
            dist/pastepad-${{ steps.v.outputs.version }}.zip
            dist/pastepad-${{ steps.v.outputs.version }}-portable.exe
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pastepad-${{ steps.v.outputs.version }}.zip
            dist/pastepad-${{ steps.v.outputs.version }}-portable.exe
            dist/SHA256.txt
          body: |
            ## Dos formas de instalarlo

            **`pastepad-${{ steps.v.outputs.version }}.zip`** — la recomendada.
            Descomprimelo y ejecuta `instalar.bat`. No pide
            administrador. Arranca con Windows y sale en el menu inicio.

            **`pastepad-${{ steps.v.outputs.version }}-portable.exe`** — un solo archivo.
            Lo ejecutas donde sea, sin instalar nada. Llevalo en un
            pendrive. Pesa mas porque trae el interprete de Python
            entero dentro, y por eso no se puede romper: no hay carpeta
            que se pueda separar del ejecutable.

            Ninguna de las dos necesita que tengas Python instalado.

            ## Windows Defender

            Va a salir "Windows protegio su PC" la primera vez. Mas
            informacion -> Ejecutar de todas formas.

            No es que el archivo tenga nada raro: SmartScreen avisa de
            cualquier ejecutable sin firmar hasta que acumula
            descargas. Se compila en un runner limpio de GitHub Actions
            a partir de este codigo, y el registro es publico.

            ## Verificar la descarga

            ```powershell
            Get-FileHash pastepad-${{ steps.v.outputs.version }}.zip -Algorithm SHA256
            ```
