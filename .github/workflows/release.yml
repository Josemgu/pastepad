name: Build and release

# Compila el .exe en un runner limpio de GitHub y lo publica.
# Ventaja sobre compilar en tu maquina: cualquiera puede ver el registro
# de la compilacion y comprobar que el binario sale del codigo publicado.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python prueba.py

      # Flet trae su propio empaquetador y no usa PyInstaller: mete el
      # motor de Flutter en el binario, que es lo que dibuja la interfaz.
      - name: Build
        run: |
          flet build windows --project pastepad --product pastepad `
            --company "Jose Miguel Ortiz" --copyright "MIT License" `
            --build-version 3.0.0

      - name: Checksum
        run: |
          $exe = Get-ChildItem build\windows -Recurse -Filter pastepad.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "No se genero pastepad.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist\pastepad.exe -Force
          $h = (Get-FileHash dist\pastepad.exe -Algorithm SHA256).Hash
          "$h  pastepad.exe" | Out-File -Encoding ascii dist\SHA256.txt
          Write-Host "SHA256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: pastepad
          path: |
            dist/pastepad.exe
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pastepad.exe
            dist/SHA256.txt
          body: |
            Descarga `pastepad.exe` y ejecutalo. No necesita instalacion.

            Windows Defender puede marcarlo la primera vez: es un falso
            positivo habitual con ejecutables recien compilados y sin
            firmar. El binario se compila en un runner limpio de GitHub
            Actions a partir de este codigo, y el registro de la
            compilacion es publico.

            Verifica la descarga comparando el hash:

            ```powershell
            Get-FileHash pastepad.exe -Algorithm SHA256
            ```
