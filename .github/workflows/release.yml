name: Build and release

# Compila el .exe en un runner limpio de GitHub y lo publica.
# Ventaja sobre compilar en tu maquina: cualquiera puede ver el registro
# de la compilacion y comprobar que el binario sale del codigo publicado.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python prueba.py

      # flet pack y no flet build: el segundo compila con el SDK de
      # Flutter, mas de un giga de descarga en cada ejecucion del CI.
      - name: Build
        run: |
          flet pack main.py --onedir --name pastepad `
            --icon docs/pastepad.ico `
            --product-name pastepad `
            --file-description "pastepad - gestor de portapapeles" `
            --product-version 3.0.0 --file-version 3.0.0 `
            --company-name "Jose Miguel Ortiz" `
            --copyright "MIT License" `
            --distpath instalador/dist -y

      # Se publica el zip entero y no el .exe suelto: el ejecutable
      # necesita las dependencias que hay a su lado, y ademas asi el
      # instalador viaja con el.
      - name: Empaquetar y firmar el hash
        run: |
          $exe = "instalador\dist\pastepad\pastepad.exe"
          if (-not (Test-Path $exe)) { throw "No se genero pastepad.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -DestinationPath dist\pastepad-3.0.0.zip `
            -Path instalador\dist\pastepad, instalador\instalar.bat,
                  instalador\desinstalar.bat, instalador\LEEME.txt
          $h = (Get-FileHash dist\pastepad-3.0.0.zip -Algorithm SHA256).Hash
          "$h  pastepad-3.0.0.zip" | Out-File -Encoding ascii dist\SHA256.txt
          Write-Host "SHA256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: pastepad
          path: |
            dist/pastepad-3.0.0.zip
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pastepad-3.0.0.zip
            dist/SHA256.txt
          body: |
            Descarga el zip, descomprimelo y ejecuta `instalar.bat`.
            No pide administrador.

            Windows Defender puede marcarlo la primera vez: es un falso
            positivo habitual con ejecutables recien compilados y sin
            firmar. El binario se compila en un runner limpio de GitHub
            Actions a partir de este codigo, y el registro de la
            compilacion es publico.

            Verifica la descarga comparando el hash:

            ```powershell
            Get-FileHash pastepad-3.0.0.zip -Algorithm SHA256
            ```
