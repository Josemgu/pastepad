<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" width="380" height="480" role="img" aria-label="Menu de carpetas abierto">
<title>pastepad desplegable de carpetas</title>
<desc>El menu bajo el boton de carpeta activa: Todas las carpetas, la lista con un check en la elegida, y las acciones Nueva, Renombrar, Eliminar.</desc>

<rect x="0" y="0" width="380" height="480" rx="20" fill="#0B0B0D" stroke="#242429" stroke-width="1"/>
<text x="16" y="26" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">Ctrl + Shift + V</text>
<circle cx="300" cy="20" r="10" fill="#1B1B1F" />
<text x="300" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">II</text>
<circle cx="330" cy="20" r="10" fill="#1B1B1F" />
<text x="330" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">@</text>
<circle cx="360" cy="20" r="10" fill="#1B1B1F" />
<text x="360" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">x</text>
<rect x="16" y="38" width="348" height="42" rx="12" fill="#141417" />
<text x="32" y="64" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6B6B75" text-anchor="start">◎  Buscar en todo</text>
<rect x="16" y="90" width="172" height="30" rx="15" fill="#1B1B1F" />
<text x="102" y="109" font-family="Segoe UI" font-size="12" font-weight="400" fill="#9C9CA6" text-anchor="middle">Reciente</text>
<rect x="192" y="90" width="172" height="30" rx="15" fill="#2DD4A7" />
<text x="278" y="109" font-family="Segoe UI" font-size="12" font-weight="500" fill="#052E23" text-anchor="middle">Guardados</text>
<rect x="16" y="128" width="348" height="34" rx="10" fill="#2DD4A7" />
<text x="30" y="150" font-family="Segoe UI" font-size="12" font-weight="500" fill="#052E23" text-anchor="start">📁  Trabajo</text>
<text x="352" y="150" font-family="Segoe UI" font-size="13" font-weight="400" fill="#052E23" text-anchor="middle">▴</text>
<rect x="19" y="173" width="240" height="250" rx="12" fill="#000000" opacity="0.35"/>
<rect x="16" y="168" width="240" height="250" rx="12" fill="#141417" stroke="#242429" stroke-width="1"/>
<text x="32" y="194" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#F4F4F5" text-anchor="start">📂  Todas las carpetas</text>
<line x1="26" y1="213" x2="246" y2="213" stroke="#242429" stroke-width="1"/>
<text x="32" y="229" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#EF4444" text-anchor="start">✓  Trabajo</text>
<text x="32" y="256" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#F4F4F5" text-anchor="start">     Notas</text>
<text x="32" y="283" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#F4F4F5" text-anchor="start">     Casos</text>
<line x1="26" y1="302" x2="246" y2="302" stroke="#242429" stroke-width="1"/>
<text x="32" y="318" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#F4F4F5" text-anchor="start">+  Nueva carpeta...</text>
<text x="32" y="345" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#F4F4F5" text-anchor="start">✎  Renombrar Trabajo</text>
<text x="32" y="372" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#EF4444" text-anchor="start">🗑  Eliminar Trabajo y su contenido</text>
