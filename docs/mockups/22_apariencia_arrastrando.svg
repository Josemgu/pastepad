<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Apariencia - eligiendo color">
<title>pastepad seleccionando acento en vivo</title>
<desc>El dialogo de apariencia con el color violeta recien elegido: el check se mueve de la bolita menta a la violeta, con un pequeno anillo de foco alrededor de la nueva.</desc>

<rect x="0" y="0" width="400" height="480" rx="20" fill="#141417" stroke="#242429" stroke-width="1"/>
<text x="24" y="38" font-family="Segoe UI" font-size="16" font-weight="500" fill="#F4F4F5" text-anchor="start">Apariencia</text>
<text x="24" y="70" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="start">Color</text>
<circle cx="41" cy="90" r="17" fill="#2DD4A7" />
<circle cx="83" cy="90" r="17" fill="#4B8DF8" />
<circle cx="125" cy="90" r="21" fill="none" stroke="#9B7BF7" stroke-width="2"/>
<circle cx="125" cy="90" r="17" fill="#9B7BF7" />
<text x="125" y="95" font-family="Segoe UI" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">✓</text>
<circle cx="167" cy="90" r="17" fill="#F5A524" />
<circle cx="209" cy="90" r="17" fill="#F76B5C" />
<circle cx="251" cy="90" r="17" fill="#F472B6" />
<text x="24" y="140" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="start">Tamano del panel</text>
<rect x="24" y="150" width="82" height="30" rx="10" fill="#1B1B1F" />
<text x="65" y="169" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="middle">Mini</text>
<rect x="110" y="150" width="82" height="30" rx="10" fill="#1B1B1F" />
<text x="151" y="169" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="middle">Chico</text>
<rect x="196" y="150" width="82" height="30" rx="10" fill="#2DD4A7" />
<text x="237" y="169" font-family="Segoe UI" font-size="10" font-weight="400" fill="#052E23" text-anchor="middle">Mediano</text>
<rect x="282" y="150" width="82" height="30" rx="10" fill="#1B1B1F" />
<text x="323" y="169" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="middle">Grande</text>
<text x="24" y="210" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="start">Carpetas</text>
<rect x="24" y="220" width="172" height="32" rx="10" fill="#2DD4A7" />
<text x="110" y="240" font-family="Segoe UI" font-size="10.5" font-weight="500" fill="#052E23" text-anchor="middle">Lista desplegable</text>
<rect x="204" y="220" width="172" height="32" rx="10" fill="#1B1B1F" />
<text x="290" y="240" font-family="Segoe UI" font-size="10.5" font-weight="400" fill="#9C9CA6" text-anchor="middle">Fichas en fila</text>
<text x="24" y="282" font-family="Segoe UI" font-size="10" font-weight="400" fill="#9C9CA6" text-anchor="start">Atajo para abrir</text>
<rect x="24" y="292" width="352" height="36" rx="10" fill="#1B1B1F" />
<text x="38" y="315" font-family="Segoe UI" font-size="12" font-weight="400" fill="#F4F4F5" text-anchor="start">Ctrl + Shift + V</text>
<text x="360" y="315" font-family="Segoe UI" font-size="12" font-weight="400" fill="#9C9CA6" text-anchor="start">▾</text>
<rect x="24" y="416" width="90" height="32" rx="10" fill="#1B1B1F" />
<text x="69" y="437" font-family="Segoe UI" font-size="11" font-weight="400" fill="#F4F4F5" text-anchor="middle">Cancelar</text>
<rect x="282" y="416" width="94" height="32" rx="10" fill="#9B7BF7" />
<text x="329" y="437" font-family="Segoe UI" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Aplicar</text>
</svg>