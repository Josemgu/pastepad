<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Windows Defender - SmartScreen">
<title>pantalla azul de Windows al abrir el .exe</title>
<desc>La pantalla azul nativa de Windows que aparece la primera vez, con Mas informacion y Ejecutar de todas formas. No es parte del programa: es de Windows.</desc>

<rect width="460" height="320" fill="#0B57C4" rx="8"/>
<rect x="0" y="0" width="460" height="70" fill="#0A4DA8"/>
<text x="30" y="42" font-family="Segoe UI" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">🛡  Windows protegio su PC</text>
<text x="30" y="90" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">Microsoft Defender SmartScreen impidio que se</text>
<text x="30" y="108" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">inicie una aplicacion que no reconoce y que</text>
<text x="30" y="126" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">podria poner en riesgo tu PC.</text>
<rect x="30" y="160" width="220" height="50" rx="4" fill="#0A4DA8" />
<path d="M42 172 l14 14 20 -24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="180" font-family="Segoe UI" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="start">Aplicacion: pastepad.exe</text>
<text x="78" y="198" font-family="Segoe UI" font-size="11" font-weight="400" fill="#DCE7FA" text-anchor="start">Editor: Editor no identificado</text>
<text x="30" y="240" font-family="Segoe UI" font-size="13" font-weight="500" fill="#8FC4FF" text-anchor="start">Mas informacion</text>
<rect x="30" y="260" width="150" height="36" rx="3" fill="#FFFFFF" />
<text x="105" y="283" font-family="Segoe UI" font-size="12" font-weight="500" fill="#0B57C4" text-anchor="middle">No ejecutar</text>
</svg>