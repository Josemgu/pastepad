<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" role="img" aria-label="Estirando la ventana">
<title>pastepad redimensionar en vivo</title>
<desc>El panel a mitad de un arrastre desde la esquina inferior derecha: el cursor de redimensionar y una linea punteada mostrando el tamano anterior, para comparar con el nuevo.</desc>

<rect x="20" y="20" width="280" height="300" rx="20" fill="none" stroke="#6B6B75" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="20" y="12" font-family="Segoe UI" font-size="9" font-weight="400" fill="#6B6B75" text-anchor="start">tamano anterior</text>
<rect x="20" y="40" width="400" height="340" rx="20" fill="#0B0B0D" stroke="#2DD4A7" stroke-width="1.5"/>
<text x="16" y="26" font-family="Segoe UI" font-size="11" font-weight="400" fill="#6B6B75" text-anchor="start">Ctrl + Shift + V</text>
<circle cx="300" cy="20" r="10" fill="#1B1B1F" />
<text x="300" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">II</text>
<circle cx="330" cy="20" r="10" fill="#1B1B1F" />
<text x="330" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">@</text>
<circle cx="360" cy="20" r="10" fill="#1B1B1F" />
<text x="360" y="24" font-family="Segoe UI" font-size="9" font-weight="400" fill="#9C9CA6" text-anchor="middle">x</text>
<rect x="38" y="80" width="404" height="42" rx="12" fill="#141417" />
<text x="56" y="106" font-family="Segoe UI" font-size="13" font-weight="400" fill="#6B6B75" text-anchor="start">◎  Buscar en todo</text>
<rect x="38" y="132" width="190" height="30" rx="15" fill="#2DD4A7" />
<text x="133" y="151" font-family="Segoe UI" font-size="12" font-weight="500" fill="#052E23" text-anchor="middle">Reciente</text>
<rect x="232" y="132" width="188" height="30" rx="15" fill="#1B1B1F" />
<text x="326" y="151" font-family="Segoe UI" font-size="12" font-weight="400" fill="#9C9CA6" text-anchor="middle">Guardados</text>
<rect x="38" y="174" width="404" height="56" rx="14" fill="#2DD4A7" />
<text x="56" y="204" font-family="Segoe UI" font-size="12.5" font-weight="500" fill="#052E23" text-anchor="start">Reporte mensual de facturacion</text>
<rect x="38" y="238" width="404" height="56" rx="14" fill="#1B1B1F" />
<text x="56" y="268" font-family="Segoe UI" font-size="12.5" font-weight="400" fill="#F4F4F5" text-anchor="start">Hola [[nombre]], te escribo sobre...</text>
<path d="M406 394 l14 -14 m-9 14 h9 v-9" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M434 366 l-14 14 m9 -14 h-9 v9" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="400" font-family="Segoe UI" font-size="10" font-weight="400" fill="#6B6B75" text-anchor="start">El redimensionado ahora lo maneja Windows de forma nativa:</text>
</svg>