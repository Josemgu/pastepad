<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="460" height="320" role="img" aria-label="Windows Defender - tras Mas informacion">
<title>pantalla azul con Ejecutar de todas formas visible</title>
<desc>El mismo aviso, un paso despues: al hacer clic en Mas informacion aparece el boton Ejecutar de todas formas.</desc>

<rect width="460" height="320" fill="#0B57C4" rx="8"/>
<rect x="0" y="0" width="460" height="70" fill="#0A4DA8"/>
<text x="30" y="42" font-family="Segoe UI" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="start">🛡  Windows protegio su PC</text>
<text x="30" y="90" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">Microsoft Defender SmartScreen impidio que se</text>
<text x="30" y="108" font-family="Segoe UI" font-size="12" font-weight="400" fill="#DCE7FA" text-anchor="start">inicie una aplicacion que no reconoce.</text>
<rect x="30" y="140" width="400" height="80" rx="4" fill="#0A4DA8" />
<text x="46" y="164" font-family="Segoe UI" font-size="11" font-weight="400" fill="#FFFFFF" text-anchor="start">Aplicacion: pastepad.exe</text>
<text x="46" y="182" font-family="Segoe UI" font-size="11" font-weight="400" fill="#DCE7FA" text-anchor="start">Editor: Editor no identificado</text>
<text x="46" y="200" font-family="Segoe UI" font-size="11" font-weight="400" fill="#DCE7FA" text-anchor="start">Fecha: hoy</text>
<rect x="30" y="244" width="220" height="38" rx="3" fill="#2E8B3D" />
<text x="140" y="268" font-family="Segoe UI" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Ejecutar de todas formas</text>
<rect x="260" y="244" width="150" height="38" rx="3" fill="#FFFFFF" />
<text x="335" y="268" font-family="Segoe UI" font-size="12" font-weight="500" fill="#0B57C4" text-anchor="middle">No ejecutar</text>
</svg>