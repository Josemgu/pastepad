<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="Error - atajo ya en uso">
<title>pastepad aviso de atajo ocupado</title>
<desc>Aviso amarillo de advertencia: el atajo elegido lo tiene otro programa, con sugerencia de probar otra combinacion.</desc>

<rect x="0" y="0" width="380" height="240" rx="20" fill="#141417" stroke="#F59E0B" stroke-width="1.5"/>
<circle cx="40" cy="42" r="15" fill="#3A2A06" />
<text x="40" y="48" font-family="Segoe UI" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">!</text>
<text x="66" y="38" font-family="Segoe UI" font-size="14" font-weight="500" fill="#F4F4F5" text-anchor="start">No se pudo registrar</text>
<text x="24" y="80" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">Ctrl + Shift + V ya lo esta usando</text>
<text x="24" y="96" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">otro programa en tu sistema.</text>
<text x="24" y="120" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">Se mantiene el atajo anterior. Prueba</text>
<text x="24" y="136" font-family="Segoe UI" font-size="11" font-weight="400" fill="#9C9CA6" text-anchor="start">con otra combinacion desde Apariencia.</text>
<rect x="24" y="184" width="332" height="32" rx="10" fill="#2DD4A7" />
<text x="190" y="205" font-family="Segoe UI" font-size="11" font-weight="500" fill="#052E23" text-anchor="middle">Entendido</text>
</svg>