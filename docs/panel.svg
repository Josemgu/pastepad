<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" width="380" height="500" role="img" aria-label="The pastepad panel">
<title>The panel</title>
<desc>Header with pause, palette and close icons; a search box; Recent and Saved tabs; folder chips; a list of entries with pin, edit and delete icons; and a footer with folder, list, broom, select and New buttons.</desc>
<style>
  .bg{fill:#161616}.card{fill:#242424}.brd{stroke:#2e2e2e;stroke-width:1;fill:none}
  .t{fill:#f0f0f0}.dim{fill:#8e8e8e}.on{fill:#fff}.ac{fill:#3b82f6}
  text{font-family:'Segoe UI',system-ui,sans-serif}
  .ico{fill:#8e8e8e;font-family:'Segoe UI Symbol',sans-serif;font-size:11px}
  @media (prefers-color-scheme: light){
    .bg{fill:#f7f7f5}.card{fill:#efefec}.brd{stroke:#dcdcd8}
    .t{fill:#1c1c1c}.dim{fill:#6e6e6b}.ico{fill:#6e6e6b}
  }
</style>

<rect class="bg" width="380" height="500" rx="13"/>
<rect class="brd" x="0.5" y="0.5" width="379" height="499" rx="13"/>

<text class="dim" x="16" y="26" font-size="11">Clipboard</text>
<text class="ico" x="304" y="27">❚❚</text>
<circle cx="333" cy="22" r="6" fill="none" stroke="#8e8e8e" stroke-width="1.3"/>
<text class="ico" x="356" y="27" text-anchor="middle">✕</text>

<rect class="card" x="14" y="38" width="352" height="34" rx="9"/>
<circle cx="34" cy="55" r="5" fill="none" stroke="#8e8e8e" stroke-width="1.5"/>
<line x1="38" y1="59" x2="42" y2="63" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"/>
<text class="dim" x="52" y="59" font-size="12">Search everything</text>

<rect class="ac" x="14" y="80" width="172" height="26" rx="13"/>
<text class="on" x="100" y="97" font-size="11" text-anchor="middle">Recent</text>
<rect class="card" x="194" y="80" width="172" height="26" rx="13"/>
<text class="t" x="280" y="97" font-size="11" text-anchor="middle">Saved</text>

<g>
  <rect class="ac" x="12" y="118" width="352" height="44" rx="8"/>
  <text class="on" x="28" y="137" font-size="12">Meeting notes template</text>
  <text class="on" x="28" y="152" font-size="10" opacity=".72">22 characters</text>
  <text x="292" y="145" class="ico" fill="#fff">⚑</text>
  <text x="316" y="145" class="ico" fill="#fff">✎</text>
  <text x="340" y="145" class="ico" fill="#fff">🗑</text>
</g>

<g>
  <rect class="card" x="12" y="166" width="352" height="44" rx="8"/>
  <text class="t" x="28" y="185" font-size="12">Hi [[name]], following up on [[topic]]...</text>
  <text class="dim" x="28" y="200" font-size="10">86 characters</text>
</g>

<g>
  <rect class="card" x="12" y="214" width="352" height="44" rx="8"/>
  <text class="t" x="28" y="233" font-size="12">Image copied</text>
  <text class="dim" x="28" y="248" font-size="10">screenshot</text>
</g>

<g>
  <rect class="card" x="12" y="262" width="352" height="44" rx="8"/>
  <text class="t" x="28" y="281" font-size="12">Weekly status report heading</text>
  <text class="dim" x="28" y="296" font-size="10">28 characters</text>
</g>

<g>
  <rect class="card" x="12" y="310" width="352" height="44" rx="8"/>
  <text class="t" x="28" y="329" font-size="12">https://example.com/docs</text>
  <text class="dim" x="28" y="344" font-size="10">24 characters</text>
</g>

<g>
  <rect class="card" x="12" y="358" width="352" height="44" rx="8"/>
  <text class="t" x="28" y="377" font-size="12">git commit -m "fix: typo"</text>
  <text class="dim" x="28" y="392" font-size="10">25 characters</text>
</g>

<g opacity=".45">
  <rect class="card" x="12" y="406" width="352" height="30" rx="8"/>
  <text class="t" x="28" y="425" font-size="12">Thanks for the update, I will review...</text>
</g>

<line x1="14" y1="450" x2="366" y2="450" class="brd"/>
<text class="ico" x="26" y="474">🧹</text>
<rect class="card" x="46" y="458" width="88" height="28" rx="8"/>
<text class="dim" x="90" y="476" font-size="11" text-anchor="middle">Select</text>
<rect class="ac" x="274" y="456" width="92" height="30" rx="8"/>
<text class="on" x="320" y="475" font-size="12" text-anchor="middle">+  New</text>
</svg>
