<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="pastepad">
<title>pastepad</title>
<desc>Tres tarjetas apiladas y ligeramente giradas. Las dos de atras en blanco grisaceo; la de delante en verde menta, con dos lineas de texto dentro, que es la entrada elegida de la lista.</desc>

<defs>
  <linearGradient id="menta" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3BE0B4"/><stop offset="1" stop-color="#1FA680"/>
  </linearGradient>
  <linearGradient id="blanco" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDEDEA"/>
  </linearGradient>
  <linearGradient id="gris" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5F5F3"/><stop offset="1" stop-color="#DADAD6"/>
  </linearGradient>
  <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>

<g filter="url(#sombra)">
  <!-- tarjeta de atras -->
  <rect x="52" y="122" width="152" height="60" rx="12"
        fill="url(#gris)" stroke="#C6C6C2" stroke-width="4" transform="rotate(-4 128 152)"/>
  <!-- tarjeta del medio -->
  <rect x="52" y="96" width="152" height="60" rx="12"
        fill="url(#blanco)" stroke="#D4D4D0" stroke-width="4.5" transform="rotate(2 128 126)"/>
  <!-- tarjeta de delante: la activa, en el acento de fabrica -->
  <rect x="48" y="64" width="160" height="66" rx="13"
        fill="url(#menta)" stroke="#0F3D30" stroke-width="5"/>
  <rect x="68" y="82" width="90" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="68" y="100" width="60" height="7" rx="3.5" fill="#052E23" opacity="0.6"/>
</g>
</svg>
