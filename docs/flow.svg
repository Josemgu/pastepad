<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" width="820" height="130" role="img" aria-label="How pasting works, in four steps">
<title>How pasting works</title>
<desc>Four steps: click the field, press Ctrl Alt V, type two letters, press Enter and the text lands in the field.</desc>
<style>
  .card{fill:#242424}.t{fill:#f0f0f0}.dim{fill:#8e8e8e}.ac{fill:#3b82f6}
  .arrow{stroke:#3b82f6;stroke-width:1.5;fill:none}
  text{font-family:'Segoe UI',system-ui,sans-serif}
  @media (prefers-color-scheme: light){
    .card{fill:#efefec}.t{fill:#1c1c1c}.dim{fill:#6e6e6b}
  }
</style>
<defs>
  <marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6" fill="#3b82f6"/>
  </marker>
</defs>

<g>
  <rect class="card" x="6" y="26" width="180" height="78" rx="10"/>
  <circle class="ac" cx="28" cy="50" r="10"/>
  <text fill="#fff" x="28" y="54" font-size="11" text-anchor="middle">1</text>
  <text class="t" x="46" y="54" font-size="13">Click the field</text>
  <text class="dim" x="22" y="82" font-size="11">where the text goes</text>
</g>
<line class="arrow" x1="192" y1="65" x2="204" y2="65" marker-end="url(#a)"/>

<g>
  <rect class="card" x="212" y="26" width="180" height="78" rx="10"/>
  <circle class="ac" cx="234" cy="50" r="10"/>
  <text fill="#fff" x="234" y="54" font-size="11" text-anchor="middle">2</text>
  <text class="t" x="252" y="54" font-size="13">Ctrl + Alt + V</text>
  <text class="dim" x="228" y="82" font-size="11">panel opens at the cursor</text>
</g>
<line class="arrow" x1="398" y1="65" x2="410" y2="65" marker-end="url(#a)"/>

<g>
  <rect class="card" x="418" y="26" width="180" height="78" rx="10"/>
  <circle class="ac" cx="440" cy="50" r="10"/>
  <text fill="#fff" x="440" y="54" font-size="11" text-anchor="middle">3</text>
  <text class="t" x="458" y="54" font-size="13">Type two letters</text>
  <text class="dim" x="434" y="82" font-size="11">the list filters itself</text>
</g>
<line class="arrow" x1="604" y1="65" x2="616" y2="65" marker-end="url(#a)"/>

<g>
  <rect class="card" x="624" y="26" width="190" height="78" rx="10"/>
  <circle class="ac" cx="646" cy="50" r="10"/>
  <text fill="#fff" x="646" y="54" font-size="11" text-anchor="middle">4</text>
  <text class="t" x="664" y="54" font-size="13">Enter</text>
  <text class="dim" x="640" y="82" font-size="11">text lands where you were</text>
</g>
</svg>
