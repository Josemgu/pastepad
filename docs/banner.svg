<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="pastepad, a clipboard manager for Windows" font-family="Segoe UI, system-ui, sans-serif">
<title>pastepad</title>
<desc>Logo and tagline next to a preview of the panel: search box, Recent and Saved tabs, and a list of clipboard entries with a pinned link.</desc>
<defs>
  <linearGradient id="menta" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3BE0B4"/><stop offset="1" stop-color="#1FA680"/>
  </linearGradient>
  <linearGradient id="blanco" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDEDEA"/>
  </linearGradient>
  <linearGradient id="grisc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5F5F3"/><stop offset="1" stop-color="#DADAD6"/>
  </linearGradient>
</defs>

<rect fill="#0B0B0D" width="880" height="260" rx="20"/>

<!-- la marca, a escala 0.30 del logo de 256 -->
<g transform="translate(52,46) scale(0.30)">
  <rect x="52" y="122" width="152" height="60" rx="12"
        fill="url(#grisc)" stroke="#C6C6C2" stroke-width="4" transform="rotate(-4 128 152)"/>
  <rect x="52" y="96" width="152" height="60" rx="12"
        fill="url(#blanco)" stroke="#D4D4D0" stroke-width="4.5" transform="rotate(2 128 126)"/>
  <rect x="48" y="64" width="160" height="66" rx="13"
        fill="url(#menta)" stroke="#0F3D30" stroke-width="5"/>
  <rect x="68" y="82" width="90" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="68" y="100" width="60" height="7" rx="3.5" fill="#052E23" opacity="0.6"/>
</g>

<text fill="#F4F4F5" x="132" y="96" font-size="48" font-weight="600">pastepad</text>
<text fill="#9C9CA6" x="134" y="130" font-size="17">A clipboard manager for Windows</text>

<g transform="translate(60,158)">
  <rect fill="#1B1B1F" width="42" height="30" rx="8"/>
  <text fill="#F4F4F5" x="21" y="20" font-size="13" text-anchor="middle">Ctrl</text>
  <text fill="#9C9CA6" x="52" y="20" font-size="14">+</text>
  <rect fill="#1B1B1F" x="66" width="46" height="30" rx="8"/>
  <text fill="#F4F4F5" x="89" y="20" font-size="13" text-anchor="middle">Shift</text>
  <text fill="#9C9CA6" x="122" y="20" font-size="14">+</text>
  <rect fill="#1B1B1F" x="136" width="30" height="30" rx="8"/>
  <text fill="#F4F4F5" x="151" y="20" font-size="13" text-anchor="middle">V</text>
  <text fill="#9C9CA6" x="182" y="20" font-size="14">anywhere</text>
</g>

<g transform="translate(556,30)">
  <rect fill="#141417" width="272" height="200" rx="16"/>
  <rect width="272" height="200" rx="16" fill="none" stroke="#242429" stroke-width="1" fill="none"/>

  <rect fill="#1B1B1F" x="14" y="16" width="244" height="28" rx="8"/>
  <circle cx="34" cy="30" r="5" fill="none" stroke="#6B6B75" stroke-width="1.5"/>
  <line x1="38" y1="34" x2="42" y2="38" stroke="#6B6B75" stroke-width="1.5" stroke-linecap="round"/>
  <text fill="#9C9CA6" x="52" y="34" font-size="11">Search everything</text>

  <rect fill="#2DD4A7" x="14" y="52" width="118" height="22" rx="11"/>
  <text fill="#052E23" x="73" y="67" font-size="10" text-anchor="middle">Recent</text>
  <rect fill="#1B1B1F" x="140" y="52" width="118" height="22" rx="11"/>
  <text fill="#9C9CA6" x="199" y="67" font-size="10" text-anchor="middle">Saved</text>

  <rect fill="#2DD4A7" x="14" y="84" width="244" height="34" rx="8"/>
  <text fill="#052E23" x="42" y="99" font-size="10">🔗 https://docs.python.org</text>
  <text fill="#052E23" x="28" y="112" font-size="9" opacity=".72">docs.python.org</text>

  <rect fill="#1B1B1F" x="14" y="124" width="244" height="34" rx="8"/>
  <text fill="#F4F4F5" x="28" y="139" font-size="10">Hi [[name]], about [[topic]]...</text>
  <text fill="#9C9CA6" x="28" y="151" font-size="9">Templates</text>

  <rect fill="#1B1B1F" x="14" y="164" width="244" height="20" rx="8"/>
  <text fill="#9C9CA6" x="28" y="178" font-size="9">git commit -m "fix: typo"</text>
</g>
</svg>
