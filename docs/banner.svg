<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="pastepad - gestor de portapapeles para Windows">
<title>pastepad</title>
<desc>Banner: el nombre, la frase corta y una miniatura del panel con dos filas.</desc>

<defs>
  <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101014"/>
    <stop offset="55%" stop-color="#0B0B0D"/>
    <stop offset="100%" stop-color="#07120F"/>
  </linearGradient>
  <linearGradient id="menta" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2DD4A7"/>
    <stop offset="100%" stop-color="#22B58D"/>
  </linearGradient>
  <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2DD4A7" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#2DD4A7" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="marco"><rect x="0" y="0" width="880" height="260" rx="22"/></clipPath>
</defs>

<g clip-path="url(#marco)">
  <rect width="880" height="260" fill="url(#fondo)"/>
  <circle cx="700" cy="20" r="190" fill="url(#brillo)"/>

  <!-- rejilla tenue, del grid de 4px de la interfaz -->
  <g stroke="#1B1B1F" stroke-width="1" opacity="0.55">
    <path d="M0 64h880M0 128h880M0 192h880"/>
    <path d="M560 0v260M624 0v260M688 0v260M752 0v260M816 0v260"/>
  </g>

  <!-- marca -->
  <g transform="translate(56,58)">
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#menta)"/>
    <rect x="13" y="12" width="21" height="27" rx="5" fill="none" stroke="#052E23" stroke-width="2.6"/>
    <rect x="20" y="7" width="12" height="7" rx="3" fill="#052E23"/>
    <path d="M24 24h13M24 31h9" stroke="#052E23" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <text x="128" y="86" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="46" font-weight="600" fill="#F4F4F5" letter-spacing="-1">pastepad</text>
  <text x="128" y="118" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="16" font-weight="400" fill="#9C9CA6">Gestor de portapapeles para Windows</text>

  <text x="56" y="168" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="14" fill="#6B6B75">Guarda lo que copias. Lo pega donde estaba el cursor.</text>

  <!-- pastillas de caracteristicas -->
  <g font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12" font-weight="500">
    <rect x="56"  y="190" width="104" height="28" rx="14" fill="#1B1B1F" stroke="#242429"/>
    <text x="108" y="208" fill="#9C9CA6" text-anchor="middle">80 entradas</text>
    <rect x="168" y="190" width="112" height="28" rx="14" fill="#1B1B1F" stroke="#242429"/>
    <text x="224" y="208" fill="#9C9CA6" text-anchor="middle">Plantillas</text>
    <rect x="288" y="190" width="104" height="28" rx="14" fill="#1B1B1F" stroke="#242429"/>
    <text x="340" y="208" fill="#9C9CA6" text-anchor="middle">Marcadores</text>
    <rect x="400" y="190" width="116" height="28" rx="14" fill="#052E23" stroke="#2DD4A7"/>
    <text x="458" y="208" fill="#2DD4A7" text-anchor="middle">Ctrl+Shift+V</text>
  </g>

  <!-- miniatura del panel -->
  <g transform="translate(600,42)">
    <rect x="0" y="0" width="232" height="186" rx="18" fill="#0B0B0D" stroke="#242429"/>
    <rect x="14" y="16" width="204" height="26" rx="9" fill="#141417"/>
    <circle cx="30" cy="29" r="5" fill="none" stroke="#6B6B75" stroke-width="1.6"/>
    <path d="M34 33l4 4" stroke="#6B6B75" stroke-width="1.6" stroke-linecap="round"/>
    <text x="46" y="33" font-family="Segoe UI, sans-serif" font-size="10" fill="#6B6B75">Buscar en todo</text>

    <rect x="14" y="50" width="98" height="20" rx="10" fill="url(#menta)"/>
    <text x="63" y="64" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#052E23" text-anchor="middle">Reciente</text>
    <rect x="118" y="50" width="100" height="20" rx="10" fill="#1B1B1F"/>
    <text x="168" y="64" font-family="Segoe UI, sans-serif" font-size="10" fill="#9C9CA6" text-anchor="middle">Guardados</text>

    <rect x="14" y="80" width="204" height="34" rx="11" fill="url(#menta)"/>
    <rect x="22" y="89" width="3" height="16" rx="1.5" fill="#FFFFFF"/>
    <text x="34" y="97" font-family="Segoe UI, sans-serif" font-size="10" font-weight="500" fill="#052E23">Reporte mensual</text>
    <text x="34" y="109" font-family="Segoe UI, sans-serif" font-size="8" fill="#052E23" opacity="0.75">29 caracteres</text>

    <rect x="14" y="120" width="204" height="34" rx="11" fill="#1B1B1F"/>
    <text x="22" y="137" font-family="Segoe UI, sans-serif" font-size="10" fill="#F4F4F5">Hola [[nombre]]...</text>
    <text x="22" y="149" font-family="Segoe UI, sans-serif" font-size="8" fill="#6B6B75">86 caracteres</text>

    <line x1="14" y1="166" x2="218" y2="166" stroke="#242429"/>
    <rect x="160" y="172" width="58" height="0.1" fill="none"/>
  </g>
</g>
</svg>
